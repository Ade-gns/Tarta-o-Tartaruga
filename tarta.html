<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarta na Praia</title>
  <style>
    :root { --mer:#35b9d3; --mer-fonce:#1486aa; --encre:#173447; --corail:#ef765c; --jaune:#ffd45a; --blanc:#fffdf6; --ombre:0 7px 18px #15344724; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--encre); background:#f4f1df; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1rem clamp(1rem,3vw,2rem); background:var(--encre); color:var(--blanc); }
    header h1 { margin:0; font-size:clamp(1.4rem,4vw,2.15rem); }
    .top-actions { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; justify-content:flex-end; }
    button, .bloc { font:inherit; }
    button { border:0; border-radius:999px; padding:.7rem 1rem; font-weight:800; color:var(--encre); background:var(--jaune); box-shadow:var(--ombre); cursor:pointer; touch-action:manipulation; }
    button:hover, button:focus-visible { filter:brightness(.96); outline:3px solid #fff; outline-offset:2px; }
    button.secondary { background:var(--blanc); }
    #retour-index { background:var(--mer); color:var(--encre); }
    button.danger { background:#ffc3b7; }
    main { display:grid; grid-template-columns:minmax(250px,1fr) minmax(220px,.8fr) minmax(250px,1fr); gap:1rem; max-width:1500px; margin:0 auto; padding:1rem; }
    .zone { min-width:0; }
    .panneau { background:var(--blanc); border-radius:1.2rem; padding:1rem; box-shadow:var(--ombre); }
    h2 { margin:.1rem 0 .4rem; font-size:1.2rem; }
    .consigne { margin:.25rem 0 1rem; font-weight:700; }
    #grille { position:relative; aspect-ratio:1; width:min(100%,500px); margin:auto; border:5px solid #c49c5a; border-radius:.8rem; overflow:hidden; background:var(--sable); }
    .calque { position:absolute; inset:0; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); }
    .calque-sol > svg { width:100%; height:100%; display:block; }
    .calque-objets, .calque-tarta { pointer-events:none; }
    .calque-objets > svg { width:100%; height:100%; display:block; overflow:visible; }
    .tarta-position { grid-area:1 / 1; transform:translate(calc(var(--colonne) * 100%), calc(var(--ligne) * 100%)); transition:transform 250ms ease-in-out; }
    .tarta-position > svg { width:100%; height:100%; display:block; overflow:visible; }
    @media (prefers-reduced-motion:reduce) { .tarta-position { transition:none; } }
    .panneau-actions { display:flex; justify-content:center; gap:.7rem; flex-wrap:wrap; margin-top:1rem; }
    .panneau-actions #executer { background:var(--corail); color:var(--blanc); font-size:1.05rem; }
    .statut { min-height:3.7rem; margin:1rem 0 0; padding:.7rem 1rem; border-radius:.8rem; background:#e6f5e9; font-weight:700; text-align:center; }
    .statut.echec { background:#fff0df; }
    .statut.succes { background:#fff3ad; }
    .bibliotheque { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; }
    .bloc { user-select:none; touch-action:none; display:flex; align-items:center; gap:.35rem; min-height:3rem; padding:.65rem .85rem; border:3px solid transparent; border-radius:.8rem; background:#e6f5e9; box-shadow:0 3px 0 #9bc8a3; cursor:grab; font-weight:800; }
    .bloc:active { cursor:grabbing; }
    .supprimer { margin-left:auto; padding:.15rem .45rem; min-height:2rem; box-shadow:none; background:#ffc3b7; color:var(--encre); }
    .bloc.direction { background:#c9f0f4; box-shadow:0 3px 0 #77c1cc; }
    .bloc.boucle { background:#ffeab0; box-shadow:0 3px 0 #e5bc59; border-radius:.8rem 1.3rem 1.3rem .8rem; flex-direction:column; align-items:stretch; min-width:11rem; }
    .entete-boucle { display:flex; align-items:center; gap:.35rem; }
    .repeteur { display:flex; align-items:center; gap:.2rem; margin-left:auto; }
    .repeteur button { min-width:2rem; min-height:2rem; padding:.2rem .55rem; box-shadow:none; }
    .repeteur output { min-width:1.5rem; text-align:center; }
    .conteneur-boucle { min-height:2.6rem; padding:.35rem; border:2px dashed #c79d38; border-radius:.5rem; display:flex; flex-direction:column; gap:.4rem; }
    .conteneur-boucle.cible-active { border-color:var(--corail); background:#fff3e7; }
    .conteneur-boucle:empty::after { content:""; }
    .zone-programme { display:flex; flex-direction:column; max-height:calc(100vh - 7rem); }
    .programme { flex:1 1 auto; min-height:12rem; overflow-y:auto; overscroll-behavior:contain; padding:.8rem; border:3px dashed #b7c9c4; border-radius:.8rem; background:#f7fbf4; }
    .zone-programme > .compteur, .zone-programme > #niveau-suivant { flex:none; }
    .entete-boucle .supprimer { margin-left:.2rem; }
    .programme .bloc { width:fit-content; max-width:100%; }
    .programme > .bloc { margin-bottom:.45rem; }
    .programme > .bloc:not(.boucle), .conteneur-boucle > .bloc:not(.boucle) { width:100%; }
    .drop-active { border-color:var(--corail); background:#fff3e7; }
    .en-cours { border-color:var(--corail) !important; box-shadow:0 0 0 4px #ef765c66, 0 3px 0 #c85442 !important; }
    .compteur { margin:.8rem 0 0; text-align:center; font-weight:800; }
    .aide { margin:1rem 0 0; padding:.8rem; border-left:5px solid var(--corail); background:#fff2da; border-radius:.4rem; }
    footer { max-width:1500px; margin:auto; padding:0 1rem 1rem; font-size:.85rem; text-align:center; opacity:.8; }
    .cache { display:none !important; }
    @media (min-width:901px) { .zone-programme { position:sticky; top:1rem; } }
    @media (max-width:900px) { main { grid-template-columns:1fr 1fr; } .zone.grille-zone { grid-column:1 / -1; } }
    @media (max-width:620px) { header { align-items:flex-start; flex-direction:column; } .top-actions { justify-content:flex-start; } main { grid-template-columns:1fr; padding:.7rem; } .zone.grille-zone { grid-column:auto; } .panneau { padding:.8rem; } button { min-height:2.8rem; } }
  </style>
  <style>
/* Tarta-na-Praia — palette et animations de la grille, style A (plat et coloré).
   À utiliser avec tarta-plage-A.svg (coller le <svg> une fois dans index.html, ce CSS dans un <style>).
   c-NOM = remplissage, l-NOM = trait, k-NOM = arrêt de dégradé, tous lus depuis --NOM. */
:root{
  --sable: #F7CF73;
  --sable-clair: #FCE3A2;
  --sable-grain: #E0AA45;
  --sable-ride: #EBBA55;
  --sable-mouille: #D49A55;
  --sable-mouille-2: #E7B563;
  --trace: rgba(165,100,35,.5);
  --eau: #22C7C8;
  --eau-milieu: #169FC6;
  --eau-profonde: #0E64B0;
  --eau-reflet: #9AF2E8;
  --ecume: #FFFCF2;
  --roche: #3B3442;
  --roche-clair: #6C6176;
  --roche-fonce: #211C27;
  --ombre: rgba(90,45,5,.28);
  --carapace: #36A644;
  --carapace-clair: #74CE57;
  --carapace-motif: #1D7432;
  --peau: #A9E05E;
  --peau-motif: #6FB43A;
  --contour: #15361F;
  --palme: #2FA34A;
  --palme-fonce: #1A6B31;
  --tronc: #8A5A2E;
  --coquillage: #FF8C78;
  --coquillage-2: #FFE2BF;
  --coquillage-bord: #C9533F;
  --etoile: #FF6A3A;
  --etoile-point: #FFC48C;
  --etoile-bord: #B83A18;
  --trait-case: rgba(125,70,15,.32);
  --trait-eau: rgba(255,252,242,.38);
}
.c-sable{fill:var(--sable)}.l-sable{stroke:var(--sable)}.k-sable{stop-color:var(--sable)}
.c-sable-clair{fill:var(--sable-clair)}.l-sable-clair{stroke:var(--sable-clair)}.k-sable-clair{stop-color:var(--sable-clair)}
.c-sable-grain{fill:var(--sable-grain)}.l-sable-grain{stroke:var(--sable-grain)}.k-sable-grain{stop-color:var(--sable-grain)}
.c-sable-ride{fill:var(--sable-ride)}.l-sable-ride{stroke:var(--sable-ride)}.k-sable-ride{stop-color:var(--sable-ride)}
.c-sable-mouille{fill:var(--sable-mouille)}.l-sable-mouille{stroke:var(--sable-mouille)}.k-sable-mouille{stop-color:var(--sable-mouille)}
.c-sable-mouille-2{fill:var(--sable-mouille-2)}.l-sable-mouille-2{stroke:var(--sable-mouille-2)}.k-sable-mouille-2{stop-color:var(--sable-mouille-2)}
.c-trace{fill:var(--trace)}.l-trace{stroke:var(--trace)}.k-trace{stop-color:var(--trace)}
.c-eau{fill:var(--eau)}.l-eau{stroke:var(--eau)}.k-eau{stop-color:var(--eau)}
.c-eau-milieu{fill:var(--eau-milieu)}.l-eau-milieu{stroke:var(--eau-milieu)}.k-eau-milieu{stop-color:var(--eau-milieu)}
.c-eau-profonde{fill:var(--eau-profonde)}.l-eau-profonde{stroke:var(--eau-profonde)}.k-eau-profonde{stop-color:var(--eau-profonde)}
.c-eau-reflet{fill:var(--eau-reflet)}.l-eau-reflet{stroke:var(--eau-reflet)}.k-eau-reflet{stop-color:var(--eau-reflet)}
.c-ecume{fill:var(--ecume)}.l-ecume{stroke:var(--ecume)}.k-ecume{stop-color:var(--ecume)}
.c-roche{fill:var(--roche)}.l-roche{stroke:var(--roche)}.k-roche{stop-color:var(--roche)}
.c-roche-clair{fill:var(--roche-clair)}.l-roche-clair{stroke:var(--roche-clair)}.k-roche-clair{stop-color:var(--roche-clair)}
.c-roche-fonce{fill:var(--roche-fonce)}.l-roche-fonce{stroke:var(--roche-fonce)}.k-roche-fonce{stop-color:var(--roche-fonce)}
.c-ombre{fill:var(--ombre)}.l-ombre{stroke:var(--ombre)}.k-ombre{stop-color:var(--ombre)}
.c-carapace{fill:var(--carapace)}.l-carapace{stroke:var(--carapace)}.k-carapace{stop-color:var(--carapace)}
.c-carapace-clair{fill:var(--carapace-clair)}.l-carapace-clair{stroke:var(--carapace-clair)}.k-carapace-clair{stop-color:var(--carapace-clair)}
.c-carapace-motif{fill:var(--carapace-motif)}.l-carapace-motif{stroke:var(--carapace-motif)}.k-carapace-motif{stop-color:var(--carapace-motif)}
.c-peau{fill:var(--peau)}.l-peau{stroke:var(--peau)}.k-peau{stop-color:var(--peau)}
.c-peau-motif{fill:var(--peau-motif)}.l-peau-motif{stroke:var(--peau-motif)}.k-peau-motif{stop-color:var(--peau-motif)}
.c-contour{fill:var(--contour)}.l-contour{stroke:var(--contour)}.k-contour{stop-color:var(--contour)}
.c-palme{fill:var(--palme)}.l-palme{stroke:var(--palme)}.k-palme{stop-color:var(--palme)}
.c-palme-fonce{fill:var(--palme-fonce)}.l-palme-fonce{stroke:var(--palme-fonce)}.k-palme-fonce{stop-color:var(--palme-fonce)}
.c-tronc{fill:var(--tronc)}.l-tronc{stroke:var(--tronc)}.k-tronc{stop-color:var(--tronc)}
.c-coquillage{fill:var(--coquillage)}.l-coquillage{stroke:var(--coquillage)}.k-coquillage{stop-color:var(--coquillage)}
.c-coquillage-2{fill:var(--coquillage-2)}.l-coquillage-2{stroke:var(--coquillage-2)}.k-coquillage-2{stop-color:var(--coquillage-2)}
.c-coquillage-bord{fill:var(--coquillage-bord)}.l-coquillage-bord{stroke:var(--coquillage-bord)}.k-coquillage-bord{stop-color:var(--coquillage-bord)}
.c-etoile{fill:var(--etoile)}.l-etoile{stroke:var(--etoile)}.k-etoile{stop-color:var(--etoile)}
.c-etoile-point{fill:var(--etoile-point)}.l-etoile-point{stroke:var(--etoile-point)}.k-etoile-point{stop-color:var(--etoile-point)}
.c-etoile-bord{fill:var(--etoile-bord)}.l-etoile-bord{stroke:var(--etoile-bord)}.k-etoile-bord{stop-color:var(--etoile-bord)}
.c-trait-case{fill:var(--trait-case)}.l-trait-case{stroke:var(--trait-case)}.k-trait-case{stop-color:var(--trait-case)}
.c-trait-eau{fill:var(--trait-eau)}.l-trait-eau{stroke:var(--trait-eau)}.k-trait-eau{stop-color:var(--trait-eau)}
.k0{stop-opacity:0}
.vagues{animation:tnp-vague 9s linear infinite}
.vagues-lentes{animation-duration:15s}
.ecume{animation:tnp-ecume 4.5s ease-in-out infinite}
.but-onde{transform-box:fill-box;transform-origin:center;animation:tnp-but 2.6s ease-in-out infinite}
.onde{transform-box:fill-box;transform-origin:center;opacity:.55;animation:tnp-onde 2.4s ease-out infinite}
.onde-2{animation-delay:.8s}.onde-3{animation-delay:1.6s}
.tarta-plonge{transform-box:fill-box;transform-origin:center;animation:tnp-plonge .9s ease-out both}
.tarta-flotte{transform-box:fill-box;transform-origin:center;animation:tnp-flotte 3.2s ease-in-out .9s infinite}
@keyframes tnp-vague{from{transform:translateX(0)}to{transform:translateX(-100px)}}
@keyframes tnp-ecume{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(2.5px);opacity:.75}}
@keyframes tnp-but{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes tnp-onde{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.2);opacity:0}}
@keyframes tnp-plonge{0%{transform:translateY(-8px) scale(1.1)}40%{transform:translateY(2px) scale(.92)}70%{transform:translateY(-1px) scale(1.01)}100%{transform:none}}
@keyframes tnp-flotte{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.vagues,.ecume,.but-onde,.onde,.tarta-plonge,.tarta-flotte{animation:none!important}}
  </style>
</head>

    function niveau() { return NIVEAUX[indexNiveau]; }
    function afficherTextes() { document.documentElement.lang = langue; el("titre-jeu").textContent=t("titre_jeu"); el("retour-index").textContent=t("retour_index"); el("label-langue").textContent=t("langue"); el("effacer").textContent=t("effacer_progression"); el("titre-niveau").textContent=t(niveau().titre); el("consigne").textContent=t("consigne"); el("boite-titre").textContent=t("boite_titre"); el("boite-explication").textContent=t("boite_explication"); el("programme-titre").textContent=t("programme_titre"); el("executer").textContent=t("lancer"); el("recommencer").textContent=t("recommencer"); el("indice-titre").textContent=t("indice_titre"); el("indice").textContent=t(niveau().indice); el("pied").textContent=t("pied"); el("niveau-suivant").textContent=NIVEAUX.length>1?t("niveau_suivant"):t("rejouer"); el("niveau-suivant").classList.toggle("cache", false); construireLangues(); afficherCompteur(); }
    function construireLangues() { const select=el("langues"), ancienne=select.value; select.innerHTML=""; Object.keys(TEXTES).forEach(code=>{ const option=document.createElement("option"); option.value=code; option.textContent=t(`langue_${code}`); select.append(option); }); select.value=TEXTES[langue]?langue:"fr"; if(ancienne && TEXTES[ancienne]) select.value=ancienne; }
    function dessinerGrille() { const niveauActuel=niveau(), grille=el("grille"), place=(li,co,code)=>code.replace("<svg ",`<svg style="grid-row:${li+1};grid-column:${co+1}" `); let solHtml="", objetsHtml=""; grille.setAttribute("aria-label",t("aria_grille")); niveauActuel.grille.forEach((ligne,li)=>[...ligne].forEach((type,co)=>{ solHtml+=sprite(sol(niveauActuel,li,co),{label:type==="M"?t("plage"):""}); if(type==="#") objetsHtml+=place(li,co,sprite(`rocher-${(li*3+co)%3+1}`)); if(type==="M") objetsHtml+=place(li,co,sprite("but")); })); (niveauActuel.objets||[]).forEach(([li,co,id])=>objetsHtml+=place(li,co,sprite(id))); grille.innerHTML=`<div class="calque calque-sol">${solHtml}</div><div class="calque calque-objets">${objetsHtml}</div><div class="calque calque-tarta"><div class="tarta-position" id="tarta-position"></div></div>`; placerTarta(); }
    function placerTarta() { const conteneur=el("tarta-position"); conteneur.style.setProperty("--ligne",position.ligne); conteneur.style.setProperty("--colonne",position.colonne); conteneur.innerHTML=arrivee?sprite("tarta-arrivee",{classe:"tarta",label:"Tarta"}):sprite("tarta",{classe:"tarta",rotation:rotations[orientation],label:"Tarta"}); }
    function fabriquerBloc(type, options={}) { const bloc=document.createElement("div"); bloc.className=`bloc ${type=== "boucle" ? "boucle":"direction"}`; bloc.dataset.type=type; bloc.draggable=true; bloc.setAttribute("role","button"); bloc.setAttribute("aria-label",t("aria_bloc",{nom:type==="depart"?t("quand_execute"):type==="boucle"?t("repeter"):t(type)})); if(type!=="boucle" && type!=="depart") { bloc.textContent={nord:"↑ ",sud:"↓ ",est:"→ ",ouest:"← "}[type]+t(type); } else if(type==="boucle") { const entete=document.createElement("div"); entete.className="entete-boucle"; entete.append("↻ ",t("repeter")); const repeteur=document.createElement("span"); repeteur.className="repeteur"; const moins=document.createElement("button"); moins.type="button"; moins.textContent="−"; moins.setAttribute("aria-label","−"); const valeur=document.createElement("output"); valeur.textContent=options.repetitions||1; const plus=document.createElement("button"); plus.type="button"; plus.textContent="+"; plus.setAttribute("aria-label","+"); moins.addEventListener("click",e=>{e.stopPropagation(); valeur.value=Math.max(1,Number(valeur.value)-1); programme=serialiserProgramme();}); plus.addEventListener("click",e=>{e.stopPropagation(); valeur.value=Math.min(9,Number(valeur.value)+1); programme=serialiserProgramme();}); repeteur.append(moins,valeur,plus); entete.append(repeteur); bloc.append(entete); const contenu=document.createElement("div"); contenu.className="conteneur-boucle"; bloc.append(contenu); } ajouterInteractions(bloc); return bloc; }
    function ajouterInteractions(bloc) { bloc.addEventListener("dragstart",e=>{ bloc.dataset.drague="oui"; e.dataTransfer.setData("text/plain",bloc.dataset.type); e.dataTransfer.effectAllowed="copy"; }); bloc.addEventListener("dragend",()=>setTimeout(()=>delete bloc.dataset.drague,1000)); bloc.addEventListener("click",()=>{ if(bloc.dataset.drague) { delete bloc.dataset.drague; return; } if(!execution && !bloc.closest("#programme")) ajouterAuProgramme(bloc.dataset.type); }); }
    function construireBibliotheque() { const b=el("bibliotheque"); b.innerHTML=""; ["nord","sud","est","ouest","boucle"].forEach(type=>b.append(fabriquerBloc(type))); }
    function ajouterAuProgramme(type, cible=cibleActive || el("programme"), repetitions=1) { if(limiteAtteinte()) return; const bloc=fabriquerBloc(type,{repetitions}); ajouterBoutonSuppression(bloc); cible.append(bloc); if(type==="boucle") { const contenu=bloc.querySelector(".conteneur-boucle"); installerZoneDepot(contenu); installerCibleClique(contenu); } programme=serialiserProgramme(); afficherCompteur(); rendreVisible(bloc); }
    function limiteAtteinte() { return niveau().maxBlocs !== undefined && compterBlocs(programme)>=niveau().maxBlocs; }
    function compterBlocs(noeuds=programme) { return noeuds.reduce((total,noeud)=>total+1+(noeud.type==="boucle"?compterBlocs(noeud.enfants):0),0); }
    function serialiserProgramme(conteneur=el("programme")) { return [...conteneur.children].filter(n=>n.dataset.type && n.dataset.type!=="depart").map(n=>({type:n.dataset.type,repetitions:n.dataset.type==="boucle"?Number(n.querySelector("output").value):undefined,enfants:n.dataset.type==="boucle"?serialiserProgramme(n.querySelector(".conteneur-boucle")):[]})); }
    function rendreProgramme() { const zone=el("programme"); zone.innerHTML=""; const depart=fabriquerBloc("depart"); depart.dataset.type="depart"; depart.draggable=false; depart.className="bloc"; depart.textContent=t("quand_execute"); zone.append(depart); programme.forEach(noeud=>zone.append(rendreNoeud(noeud))); installerZoneDepot(zone); afficherCompteur(); }
    function ajouterBoutonSuppression(bloc) { const bouton=document.createElement("button"); bouton.type="button"; bouton.className="supprimer"; bouton.textContent="×"; bouton.setAttribute("aria-label",t("supprimer")); bouton.title=t("supprimer"); bouton.addEventListener("click",e=>{ e.stopPropagation(); if(execution) return; bloc.remove(); programme=serialiserProgramme(); afficherCompteur(); }); (bloc.querySelector(":scope > .entete-boucle") || bloc).append(bouton); }
    function rendreNoeud(noeud) { const bloc=fabriquerBloc(noeud.type,{repetitions:noeud.repetitions}); if(noeud.type==="boucle") { const contenu=bloc.querySelector(".conteneur-boucle"); noeud.enfants.forEach(enfant=>contenu.append(rendreNoeud(enfant))); installerZoneDepot(contenu); installerCibleClique(contenu); } ajouterBoutonSuppression(bloc); return bloc; }
    function installerZoneDepot(zone) { if(zone.dataset.depotInstalle==="oui") return; zone.dataset.depotInstalle="oui"; zone.addEventListener("dragover",e=>{e.preventDefault(); e.stopPropagation(); if(!limiteAtteinte()) zone.classList.add("drop-active");}); zone.addEventListener("dragleave",()=>zone.classList.remove("drop-active")); zone.addEventListener("drop",e=>{e.preventDefault(); e.stopPropagation(); zone.classList.remove("drop-active"); if(limiteAtteinte()) return; const type=e.dataTransfer.getData("text/plain"); if(["nord","sud","est","ouest","boucle"].includes(type)) { ajouterAuProgramme(type,zone); } }); }
    function installerCibleClique(zone) { if(zone.dataset.clicInstalle==="oui") return; zone.dataset.clicInstalle="oui"; zone.addEventListener("click",e=>{ e.stopPropagation(); cibleActive=zone; document.querySelectorAll(".conteneur-boucle").forEach(autre=>autre.classList.toggle("cible-active",autre===zone)); }); }
    function afficherCompteur() { const max=niveau().maxBlocs; el("compteur").textContent=max===undefined?t("blocs_utilises_sans_limite",{utilises:compterBlocs(programme)}):t("blocs_utilises",{utilises:compterBlocs(programme),max}); }
    function annulerPassageAuto() { clearTimeout(minuterieNiveau); minuterieNiveau=null; }
    function allerAuNiveauSuivant() { annulerPassageAuto(); indexNiveau=NIVEAUX.length>1?(indexNiveau+1)%NIVEAUX.length:0; afficherTextes(); reinitialiser(); }
    function reinitialiser() { annulerPassageAuto(); programme=[]; cibleActive=null; position={...niveau().depart}; orientation="nord"; arrivee=false; execution=false; el("statut").className="statut"; el("statut").textContent=""; dessinerGrille(); rendreProgramme(); }
    function pause(ms) { return new Promise(resolve=>setTimeout(resolve,ms)); }
    function rendreVisible(bloc) { const zone=el("programme"), z=zone.getBoundingClientRect(), b=bloc.getBoundingClientRect(); if(b.top<z.top) zone.scrollTop-=z.top-b.top+8; else if(b.bottom>z.bottom) zone.scrollTop+=Math.min(b.bottom-z.bottom+8, b.top-z.top-8); } // fait défiler la zone du programme seulement, pas la page
    function surligner(bloc,on) { bloc.classList.toggle("en-cours",on); if(on) rendreVisible(bloc); }
    async function executerNoeuds(noeuds, elements) { for(let i=0;i<noeuds.length;i++) { const noeud=noeuds[i], bloc=elements[i]; surligner(bloc,true); if(noeud.type==="boucle") { for(let tour=0;tour<noeud.repetitions;tour++) await executerNoeuds(noeud.enfants,[...bloc.querySelector(".conteneur-boucle").children]); } else await deplacer(noeud.type); surligner(bloc,false); if(!execution) return false; } return true; }
    async function deplacer(type) { const niveauActuel=niveau(), delta=directions[type], prochaine={ligne:position.ligne+delta.ligne,colonne:position.colonne+delta.colonne}; await pause(400); orientation=type; if(prochaine.ligne<0||prochaine.ligne>=8||prochaine.colonne<0||prochaine.colonne>=8||niveauActuel.grille[prochaine.ligne][prochaine.colonne]==="#"||objetA(prochaine,niveauActuel)) { placerTarta(); const tortue=el("grille").querySelector(".tarta"); if(tortue) tortue.animate([{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(0)"}],{duration:280}); return; } position=prochaine; placerTarta(); }
    async function lancer() { if(execution) return; annulerPassageAuto(); execution=true; if(arrivee) { position={...niveau().depart}; orientation="nord"; arrivee=false; placerTarta(); } el("statut").className="statut"; el("statut").textContent=""; const noeuds=programme; const blocs=[...el("programme").children].slice(1); await executerNoeuds(noeuds,blocs); execution=false; const atteint=position.ligne===niveau().but.ligne&&position.colonne===niveau().but.colonne; if(atteint) { el("statut").className="statut succes"; arrivee=true; placerTarta(); sauvegarder(); if(indexNiveau<NIVEAUX.length-1) { el("statut").textContent=`${t("succes")} ${t("passage_niveau")}`; minuterieNiveau=setTimeout(allerAuNiveauSuivant,DELAI_NIVEAU_SUIVANT); } else el("statut").textContent=t("tous_niveaux_termines"); } else { el("statut").className="statut echec"; el("statut").textContent=t("echec"); } }
    function sauvegarder() { try { const donnees=JSON.parse(localStorage.getItem(stockage)||"{}"); donnees[indexNiveau]=true; localStorage.setItem(stockage,JSON.stringify(donnees)); } catch(erreur) { console.warn("Sauvegarde indisponible",erreur); } }
    function effacerProgression() { try { localStorage.removeItem(stockage); el("statut").textContent=t("progression_effacee"); } catch(erreur) { console.warn("Effacement indisponible",erreur); } }
    function changerLangue(code) { langue=TEXTES[code]?code:"fr"; try { localStorage.setItem("tarta-na-praia-langue",langue); } catch(erreur) { console.warn("Langue non mémorisée",erreur); } afficherTextes(); rendreProgramme(); }
    el("executer").addEventListener("click",lancer); el("recommencer").addEventListener("click",reinitialiser); el("effacer").addEventListener("click",effacerProgression); el("retour-index").addEventListener("click",()=>{ window.location.href="index.html"; }); el("langues").addEventListener("change",e=>changerLangue(e.target.value)); el("niveau-suivant").addEventListener("click",allerAuNiveauSuivant);
    try { const langueSauvee=localStorage.getItem("tarta-na-praia-langue"); if(langueSauvee && TEXTES[langueSauvee]) langue=langueSauvee; } catch(erreur) { console.warn("Lecture de langue indisponible",erreur); }
    afficherTextes(); construireBibliotheque(); rendreProgramme(); installerZoneDepot(el("programme")); dessinerGrille();
  </script>
