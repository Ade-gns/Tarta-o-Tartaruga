<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le labyrinthe</title>
  <style>
    /* Le labyrinthe — scène 1024×768 (maquette « Labyrinthe »), mise à l'échelle par mettreAEchelle().
       Pas de flex « gap » ni de syntaxe récente : le jeu doit tourner sur de vieux navigateurs. */
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; overflow:hidden; background:#15361F; }
    body { font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:#15361F; }
    button { font-family:inherit; color:#15361F; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    /* Focus clavier : visible partout ; les navigateurs récents le cachent après un clic souris. */
    button:focus { outline:5px solid #0E64B0; outline-offset:3px; }
    button:focus:not(:focus-visible) { outline:none; }
    .cache { display:none !important; }
    .pour-lecteur { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

    /* position:fixed : la scène non réduite ne doit pas élargir la page (sinon les navigateurs mobiles dézooment). */
    .scene { position:fixed; left:0; top:0; width:1024px; height:768px; overflow:hidden; background:#F7CF73; -webkit-transform-origin:0 0; transform-origin:0 0; }
    .fond { position:absolute; left:0; top:0; }

    /* Bandeau */
    .bandeau { position:absolute; left:122px; top:12px; width:780px; height:100px; display:flex; align-items:center; padding:0 28px 0 18px; background:#FFC93C; border:4px solid #15361F; border-radius:50px; box-shadow:0 6px 0 rgba(21,54,31,.28); }
    .bandeau .tete { width:72px; height:72px; flex:none; margin-right:16px; }
    .titre { margin:0; flex:1; font-weight:700; font-size:48px; line-height:1; white-space:nowrap; }
    .niveau { flex:none; display:flex; flex-direction:column; align-items:flex-end; }
    .texte-niveau { font-weight:700; font-size:28px; line-height:1; margin-bottom:4px; }
    .etoiles svg { margin-left:4px; }

    /* Plateau de jeu : 480×480 dans le cadre de sable dessiné par le fond */
    .plateau { position:absolute; left:28px; top:162px; width:480px; height:480px; }
    .cases { position:absolute; left:0; top:0; width:480px; height:480px; overflow:hidden; border-radius:16px; }
    .cases svg, .traces svg, .objet { position:absolute; display:block; }
    .cadre { position:absolute; left:0; top:0; width:480px; height:480px; border:4px solid #15361F; border-radius:16px; pointer-events:none; }
    .crabe { position:absolute; left:0; top:0; -webkit-transition:-webkit-transform .4s ease-in-out; transition:transform .4s ease-in-out; }
    .crabe .corps { width:100%; height:100%; -webkit-transition:-webkit-transform .3s ease-in-out; transition:transform .3s ease-in-out; }
    .crabe .corps svg { width:100%; height:100%; display:block; overflow:visible; }
    .crabe.choc .corps { -webkit-animation:secoue .45s ease-in-out; animation:secoue .45s ease-in-out; }
    .crabe.content .corps { -webkit-animation:saute .6s ease-in-out 2; animation:saute .6s ease-in-out 2; }
    @-webkit-keyframes secoue { 0%,100% { -webkit-transform:rotate(-8deg); } 20% { -webkit-transform:translateX(-7px) rotate(-8deg); } 40% { -webkit-transform:translateX(7px) rotate(-8deg); } 60% { -webkit-transform:translateX(-5px) rotate(-8deg); } 80% { -webkit-transform:translateX(5px) rotate(-8deg); } }
    @keyframes secoue { 0%,100% { transform:rotate(-8deg); } 20% { transform:translateX(-7px) rotate(-8deg); } 40% { transform:translateX(7px) rotate(-8deg); } 60% { transform:translateX(-5px) rotate(-8deg); } 80% { transform:translateX(5px) rotate(-8deg); } }
    @-webkit-keyframes saute { 0%,100% { -webkit-transform:translateY(0); } 50% { -webkit-transform:translateY(-12px); } }
    @keyframes saute { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }
    .impact { position:absolute; width:60px; height:60px; pointer-events:none; }

    /* Bulle « Oups ! » avec sa pointe */
    .bulle { position:absolute; width:250px; min-height:90px; padding:8px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:#fff; border:4px solid #15361F; border-radius:30px; z-index:3; }
    .bulle b { font-weight:700; font-size:36px; line-height:1; }
    .bulle span { font-weight:800; font-size:26px; line-height:1.1; margin-top:2px; }
    .bulle .pointe { position:absolute; top:100%; margin-top:-4px; width:44px; height:34px; }
    .bulle.dessous .pointe { top:auto; bottom:100%; margin-top:0; margin-bottom:-4px; -webkit-transform:scaleY(-1); transform:scaleY(-1); }

    .confettis { position:absolute; left:0; top:0; pointer-events:none; -webkit-animation:apparait .5s ease-out; animation:apparait .5s ease-out; }
    @-webkit-keyframes apparait { from { opacity:0; -webkit-transform:translateY(-30px); } to { opacity:1; -webkit-transform:none; } }
    @keyframes apparait { from { opacity:0; transform:translateY(-30px); } to { opacity:1; transform:none; } }

    /* Panneau de droite : consigne, programme, flèches */
    .cote { position:absolute; left:540px; top:150px; width:468px; height:504px; padding:18px 20px; display:flex; flex-direction:column; justify-content:space-between; background:#fff; border:4px solid #15361F; border-radius:34px; box-shadow:0 8px 0 rgba(21,54,31,.28); }
    .consigne { margin:0; font-weight:800; font-size:26px; line-height:1.2; text-align:center; }
    .bravo { margin:0; padding:8px 0; text-align:center; background:#FFC93C; border:4px solid #15361F; border-radius:40px; font-weight:700; font-size:52px; line-height:1.1; }
    .titre-programme { margin:0; font-weight:700; font-size:32px; line-height:1; }
    .programme { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4, 1fr); grid-gap:12px; }
    .programme.serre { grid-gap:10px; }
    .emplacement { position:relative; width:100%; height:84px; padding:0; display:flex; align-items:center; justify-content:center; background:#FFF9E6; border:3px solid #E6D49B; border-radius:22px; cursor:pointer; }
    .programme.serre .emplacement { height:72px; }
    .emplacement svg { width:72px; height:55px; display:block; }
    .emplacement.vide { background:#FFFBEF; border:3px dashed #BCC6C9; cursor:default; }
    .emplacement.fait { background:#E3F8F5; border-color:#15361F; }
    .emplacement.actif { background:#FFC93C; border:4px solid #15361F; -webkit-transform:scale(1.07); transform:scale(1.07); box-shadow:0 4px 0 rgba(21,54,31,.28); z-index:1; }
    .emplacement.actif:before { content:""; position:absolute; top:-17px; left:50%; margin-left:-10px; border:10px solid transparent; border-top:12px solid #15361F; border-bottom:0; }
    .emplacement.choc { background:#FFB9A8; border:4px solid #15361F; }
    .emplacement:disabled { cursor:default; }
    .programme.plein { -webkit-animation:secoue-liste .4s; animation:secoue-liste .4s; }
    @-webkit-keyframes secoue-liste { 25% { -webkit-transform:translateX(-6px); } 75% { -webkit-transform:translateX(6px); } }
    @keyframes secoue-liste { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
    .fleches { display:flex; justify-content:space-between; }
    .fleche { width:130px; height:104px; padding:0; border:0; background:none; cursor:pointer; -webkit-transition:-webkit-transform .12s; transition:transform .12s; }
    .fleche svg { display:block; width:130px; height:100px; }
    .fleche:hover { -webkit-transform:translateY(-3px); transform:translateY(-3px); }
    .fleche:active { -webkit-transform:translateY(3px); transform:translateY(3px); }
    .fleche:focus { border-radius:30px; }
    .fleche:disabled { opacity:.45; cursor:default; -webkit-transform:none; transform:none; }

    /* Boutons du bas */
    .bouton { position:absolute; top:670px; height:84px; padding:0 12px; display:flex; align-items:center; justify-content:center; background:#fff; border:4px solid #15361F; border-radius:42px; font-weight:700; font-size:30px; line-height:1; cursor:pointer; box-shadow:0 5px 0 rgba(21,54,31,.28); -webkit-transition:-webkit-transform .12s; transition:transform .12s; }
    .bouton svg { flex:none; }
    .bouton svg + span { margin-left:12px; }
    .bouton span + svg { margin-left:12px; }
    .bouton.go { left:16px; width:268px; background:#74CE57; }
    .bouton.effacer { left:300px; width:220px; }
    .bouton.suivant { left:16px; width:504px; background:#FFC93C; }
    .bouton.menu { left:540px; width:300px; font-size:27px; white-space:nowrap; }
    .bouton:disabled { opacity:.45; cursor:default; box-shadow:none; }
    .bouton:hover:not(:disabled) { -webkit-transform:translateY(-2px); transform:translateY(-2px); }
    .bouton:active:not(:disabled) { -webkit-transform:translateY(3px); transform:translateY(3px); box-shadow:none; }

    /* Choix de la langue (même pastille que le lanceur) */
    .langues { position:absolute; left:848px; top:670px; width:160px; height:84px; padding:4px; display:flex; justify-content:space-between; background:#E4F6F3; border:4px solid #15361F; border-radius:42px; }
    .bouton-langue { width:70px; height:70px; border:0; border-radius:35px; background:transparent; font-weight:700; font-size:26px; cursor:pointer; }
    .bouton-langue[aria-pressed="true"] { background:#15361F; color:#fff; }

    /* Écran de fin, après le dernier niveau */
    .fin { position:absolute; left:16px; top:150px; width:992px; height:504px; display:flex; flex-direction:column; align-items:center; justify-content:space-around; padding:24px; background:#fff; border:4px solid #15361F; border-radius:40px; box-shadow:0 8px 0 rgba(21,54,31,.28); text-align:center; }
    .fin .bravo { width:440px; }
    .fin .crabe-fin { width:180px; height:180px; }
    .fin .etoiles svg { margin:0 4px; }
    .fin .bouton { position:static; width:420px; font-size:30px; }

    @media (prefers-reduced-motion:reduce) {
      .crabe, .crabe .corps, .fleche, .bouton { -webkit-transition:none; transition:none; }
      .crabe.choc .corps, .crabe.content .corps, .confettis, .programme.plein { -webkit-animation:none; animation:none; }
      .crabe.choc .corps { -webkit-transform:rotate(-8deg); transform:rotate(-8deg); }
    }
  </style>
</head>

  <!-- ===== Logique et affichage ===== -->
  <script>
(function () {
  "use strict";

  // ---------- Réglages ----------
  var CLE_LANGUE = "tarta-na-praia-langue";      // partagée avec le lanceur
  var CLE_PROGRESSION = "labyrinthe_niveaux";    // { reussis: [ids], serie_terminee: bool }
  var DELAI_ORDRE = 500;                         // durée d'un ordre pendant l'exécution (ms)
  var DUREE_OUPS = 800;                          // durée de la bulle « Oups ! » sur un mur (ms)
  var TAILLE_PLATEAU = 480;
  var DIRECTIONS = ["haut", "droite", "bas", "gauche"];
  var DEPLACEMENTS = { haut: [-1, 0], droite: [0, 1], bas: [1, 0], gauche: [0, -1] };
  var CLES_ORDRES = { A: "avancer", G: "tourner_gauche", D: "tourner_droite" };
  var MURS = "#=";

  function el(id) { return document.getElementById(id); }
  function lire(cle) { try { return window.localStorage.getItem(cle); } catch (erreur) { return null; } }
  function ecrire(cle, valeur) { try { window.localStorage.setItem(cle, valeur); } catch (erreur) { /* stockage indisponible : on continue sans */ } }

  // ---------- Langue ----------
  function langueInitiale() {
    var demande = (/[?&]lang=([a-z]+)/.exec(window.location.search) || [])[1];
    if (demande && TEXTES[demande]) return demande;
    var sauvee = lire(CLE_LANGUE);
    return sauvee && TEXTES[sauvee] ? sauvee : "fr";
  }
  var langue = langueInitiale();

  function t(cle, valeurs) {
    var texte = (TEXTES[langue] || {})[cle];
    if (texte === undefined) {
      if (window.console) console.warn("Clé de texte manquante en « " + langue + " » : " + cle);
      texte = TEXTES.fr[cle] !== undefined ? TEXTES.fr[cle] : cle;
    }
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) { return valeurs && valeurs[nom] !== undefined ? valeurs[nom] : tout; });
  }

  // ---------- Progression ----------
  function lireProgression() {
    try { var p = JSON.parse(lire(CLE_PROGRESSION) || "{}"); return { reussis: p.reussis || [], serie_terminee: !!p.serie_terminee }; }
    catch (erreur) { return { reussis: [], serie_terminee: false }; }
  }
  var progression = lireProgression();
  function niveauReussi(id) { return progression.reussis.indexOf(id) >= 0; }
  function memoriserReussite(id) {
    if (!niveauReussi(id)) progression.reussis.push(id);
    var tous = true;
    for (var i = 0; i < NIVEAUX.length; i++) if (!niveauReussi(NIVEAUX[i].id)) tous = false;
    progression.serie_terminee = tous;
    ecrire(CLE_PROGRESSION, JSON.stringify(progression));
  }

  // ---------- État du jeu ----------
  var etat = {
    index: 0,             // niveau en cours
    niveau: null,
    depart: null, arrivee: null,
    position: null,       // { l, c }
    orientation: "haut",
    programme: [],        // ordres « A », « G », « D »
    statuts: [],          // état visuel de chaque emplacement : "", "actif", "fait", "choc"
    traces: [],           // { l, c, direction }
    phase: "edition",     // edition | execution | reussi | fin
    minuteries: []
  };

  function trouver(grille, lettre) {
    for (var l = 0; l < grille.length; l++) { var c = grille[l].indexOf(lettre); if (c >= 0) return { l: l, c: c }; }
    return null;
  }
  function estMur(l, c) {
    var g = etat.niveau.grille;
    return l < 0 || c < 0 || l >= g.length || c >= g[l].length || MURS.indexOf(g[l].charAt(c)) >= 0;
  }
  function tourner(direction, pas) { return DIRECTIONS[(DIRECTIONS.indexOf(direction) + pas + 4) % 4]; }
  function plus(fonction, delai) { etat.minuteries.push(window.setTimeout(fonction, delai)); }
  function arreterMinuteries() { for (var i = 0; i < etat.minuteries.length; i++) window.clearTimeout(etat.minuteries[i]); etat.minuteries = []; }

  // ---------- Affichage : plateau ----------
  function taillCase() { return TAILLE_PLATEAU / etat.niveau.taille; }
  function svgUse(id, x, y, taille, extra) {
    return '<svg viewBox="0 0 100 100" width="' + taille + '" height="' + taille + '" style="left:' + x + 'px;top:' + y + 'px' + (extra || "") + '"><use xlink:href="#dessin-' + id + '" href="#dessin-' + id + '"/></svg>';
  }

  function dessinerCases() {
    var g = etat.niveau.grille, taille = taillCase(), html = "";
    for (var l = 0; l < g.length; l++) for (var c = 0; c < g[l].length; c++) {
      var lettre = g[l].charAt(c);
      html += svgUse(lettre === "#" ? "rocher" : lettre === "=" ? "muret" : "sable", c * taille, l * taille, taille);
    }
    el("cases").innerHTML = html;
    var coquillage = el("coquillage");
    coquillage.setAttribute("width", taille); coquillage.setAttribute("height", taille);
    coquillage.style.left = etat.arrivee.c * taille + "px"; coquillage.style.top = etat.arrivee.l * taille + "px";
  }

  function dessinerTraces() {
    var taille = taillCase(), html = "";
    for (var i = 0; i < etat.traces.length; i++) {
      var trace = etat.traces[i], angle = DIRECTIONS.indexOf(trace.direction) * 90;
      html += svgUse("pas", trace.c * taille, trace.l * taille, taille, ";-webkit-transform:rotate(" + angle + "deg);transform:rotate(" + angle + "deg)");
    }
    el("traces").innerHTML = html;
  }

  // Le crabe a trois dessins (dos, côté, face) : la gauche est le dessin de côté retourné.
  var DESSINS_CRABE = { haut: "crabe-dos", droite: "crabe-cote", gauche: "crabe-cote", bas: "crabe-face" };
  function dessinerCrabe(content) {
    var taille = taillCase(), crabe = el("crabe"), corps = el("corps-crabe");
    crabe.style.width = taille + "px"; crabe.style.height = taille + "px";
    var deplacement = "translate(" + etat.position.c * taille + "px," + etat.position.l * taille + "px)";
    crabe.style.webkitTransform = deplacement; crabe.style.transform = deplacement;
    var dessin = content ? "crabe-face" : DESSINS_CRABE[etat.orientation];
    var miroir = !content && etat.orientation === "gauche" ? ' transform="translate(100 0) scale(-1 1)"' : "";
    corps.innerHTML = '<svg viewBox="0 0 100 100"><g' + miroir + '><use xlink:href="#dessin-' + dessin + '" href="#dessin-' + dessin + '"/></g></svg>';
    crabe.setAttribute("aria-label", t("crabe", { direction: t(etat.orientation) }));
  }

  // Bulle au-dessus du crabe (ou en dessous s'il est sur la première ligne), gardée dans le plateau.
  var bulleCourante = null;   // { titre: cle, texte: cle|null }
  function montrerBulle(cleTitre, cleTexte) {
    bulleCourante = { titre: cleTitre, texte: cleTexte };
    var bulle = el("bulle"), taille = taillCase();
    el("bulle-titre").textContent = t(cleTitre);
    el("bulle-texte").textContent = cleTexte ? t(cleTexte) : "";
    el("bulle-texte").className = cleTexte ? "" : "cache";
    bulle.className = "bulle";
    var centre = etat.position.c * taille + taille / 2;
    var gauche = Math.max(0, Math.min(TAILLE_PLATEAU - 250, centre - 125));
    var dessous = etat.position.l === 0;
    var hauteur = bulle.offsetHeight;
    bulle.style.left = gauche + "px";
    bulle.style.top = (dessous ? (etat.position.l + 1) * taille + 30 : etat.position.l * taille - hauteur - 26) + "px";
    if (dessous) bulle.className = "bulle dessous";
    el("bulle-pointe").style.left = (centre - gauche - 22 - 4) + "px";
  }
  function cacherBulle() { bulleCourante = null; el("bulle").className = "bulle cache"; }

  function montrerImpact(direction) {
    var taille = taillCase(), pas = DEPLACEMENTS[direction], impact = el("impact");
    impact.setAttribute("class", "impact");
    impact.style.left = (etat.position.c + 0.5 + pas[1] * 0.5) * taille - 30 + "px";
    impact.style.top = (etat.position.l + 0.5 + pas[0] * 0.5) * taille - 30 + "px";
  }
  function cacherImpact() { el("impact").setAttribute("class", "impact cache"); }

  function annoncer(texte) {
    var annonce = el("annonce");
    annonce.textContent = "";
    window.setTimeout(function () { annonce.textContent = texte; }, 50);   // vider puis remplir : force la relecture
  }

  // ---------- Affichage : panneau, bandeau, boutons ----------
  function dessinerEtoiles(conteneur, taille) {
    var html = "", reussis = 0;
    for (var i = 0; i < NIVEAUX.length; i++) {
      var allumee = niveauReussi(NIVEAUX[i].id);
      if (allumee) reussis++;
      html += '<svg width="' + taille + '" height="' + taille + '" viewBox="0 0 56 56" aria-hidden="true"><use xlink:href="#dessin-etoile" href="#dessin-etoile" fill="' + (allumee ? "#FFC93C" : "#FFF9E6") + '"/></svg>';
    }
    conteneur.innerHTML = html;
    conteneur.setAttribute("aria-label", t("etoiles", { reussis: reussis, total: NIVEAUX.length }));
  }

  function dessinerProgramme() {
    var liste = el("programme"), html = "", bloque = etat.phase !== "edition";
    liste.className = "programme" + (etat.niveau.emplacements > 8 ? " serre" : "");
    for (var i = 0; i < etat.niveau.emplacements; i++) {
      var ordre = etat.programme[i];
      if (!ordre) { html += '<li class="emplacement vide" aria-label="' + t("emplacement_vide") + '"></li>'; continue; }
      html += '<li><button type="button" class="emplacement ' + (etat.statuts[i] || "") + '" data-index="' + i + '"' + (bloque ? " disabled" : "") +
        ' aria-label="' + t("retirer", { ordre: t(CLES_ORDRES[ordre]) }) + '"><svg viewBox="0 0 130 100" aria-hidden="true"><use xlink:href="#dessin-fleche-' + ordre + '" href="#dessin-fleche-' + ordre + '"/></svg></button></li>';
    }
    liste.innerHTML = html;
  }

  function majBoutons() {
    var edition = etat.phase === "edition", reussi = etat.phase === "reussi", fin = etat.phase === "fin";
    el("go").disabled = !edition; el("effacer").disabled = !edition;
    var fleches = ["A", "G", "D"];
    for (var i = 0; i < fleches.length; i++) el("fleche-" + fleches[i]).disabled = !edition;
    el("go").className = "bouton go" + (reussi || fin ? " cache" : "");
    el("effacer").className = "bouton effacer" + (reussi || fin ? " cache" : "");
    el("suivant").className = "bouton suivant" + (reussi ? "" : " cache");
    el("consigne").className = "consigne" + (reussi ? " cache" : "");
    el("bravo").className = "bravo" + (reussi ? "" : " cache");
    el("confettis").setAttribute("class", "confettis" + (reussi ? "" : " cache"));
    var masques = ["plateau", "cote", "menu"];
    for (var j = 0; j < masques.length; j++) el(masques[j]).style.display = fin ? "none" : "";
    el("fin").className = "fin" + (fin ? "" : " cache");
  }

  function afficherTextes() {
    document.documentElement.lang = t("code_html");
    document.title = t("titre");
    el("titre").textContent = t("titre");
    el("texte-niveau").textContent = t("niveau_x", { n: etat.index + 1, total: NIVEAUX.length });
    el("consigne").textContent = t("consigne");
    el("bravo").textContent = t("bravo");
    el("fin-bravo").textContent = t("bravo");
    el("titre-programme").textContent = t("mon_programme");
    el("fleche-A").setAttribute("aria-label", t("avancer"));
    el("fleche-G").setAttribute("aria-label", t("tourner_gauche"));
    el("fleche-D").setAttribute("aria-label", t("tourner_droite"));
    el("go-texte").textContent = t("go");
    el("effacer-texte").textContent = t("effacer");
    el("suivant-texte").textContent = t(etat.index === NIVEAUX.length - 1 ? "continuer" : "niveau_suivant");
    el("menu-texte").textContent = t("retour_menu");
    el("fin-menu-texte").textContent = t("retour_menu");
    el("cases").setAttribute("aria-label", t("plateau", { taille: etat.niveau.taille }));
    el("coquillage").setAttribute("aria-label", t("coquillage"));
    el("crabe").setAttribute("aria-label", t("crabe", { direction: t(etat.orientation) }));
    el("langues").setAttribute("aria-label", t("langue"));
    var boutons = el("langues").getElementsByTagName("button");
    for (var i = 0; i < boutons.length; i++) boutons[i].setAttribute("aria-pressed", String(boutons[i].getAttribute("data-langue") === langue));
    dessinerEtoiles(el("etoiles"), 30);
    dessinerEtoiles(el("fin-etoiles"), 56);
    dessinerProgramme();
    if (bulleCourante) montrerBulle(bulleCourante.titre, bulleCourante.texte);
  }

  function construireLangues() {
    var html = "";
    for (var code in TEXTES) if (TEXTES.hasOwnProperty(code))
      html += '<button type="button" class="bouton-langue" data-langue="' + code + '" lang="' + TEXTES[code].code_html + '">' + TEXTES[code].nom_langue + '</button>';
    el("langues").innerHTML = html;
  }

  // ---------- Niveaux ----------
  function chargerNiveau(index) {
    arreterMinuteries();
    etat.index = index;
    etat.niveau = NIVEAUX[index];
    etat.depart = trouver(etat.niveau.grille, "S");
    etat.arrivee = trouver(etat.niveau.grille, "E");
    etat.programme = [];
    etat.phase = "edition";
    remettreAuDepart();
    dessinerCases();
    afficherTextes();
    majBoutons();
  }

  // Le crabe revient au départ ; le programme, lui, reste dans la bande.
  function remettreAuDepart() {
    etat.position = { l: etat.depart.l, c: etat.depart.c };
    etat.orientation = etat.niveau.orientation;
    etat.traces = [];
    etat.statuts = [];
    cacherBulle(); cacherImpact();
    el("crabe").className = "crabe";
    dessinerTraces();
    dessinerCrabe(false);
  }

  // ---------- Édition du programme ----------
  function ajouterOrdre(ordre) {
    if (etat.phase !== "edition") return;
    if (etat.programme.length >= etat.niveau.emplacements) {
      // Programme plein : on secoue la bande, sans rien ajouter.
      var liste = el("programme");
      liste.className = liste.className.replace(" plein", "");
      void liste.offsetWidth;
      liste.className += " plein";
      annoncer(t("programme_plein"));
      return;
    }
    if (bulleCourante) remettreAuDepart();
    etat.programme.push(ordre);
    etat.statuts = [];
    dessinerProgramme();
  }

  function retirerOrdre(index) {
    if (etat.phase !== "edition" || index < 0 || index >= etat.programme.length) return;
    if (bulleCourante) remettreAuDepart();
    etat.programme.splice(index, 1);      // les ordres suivants se décalent
    etat.statuts = [];
    dessinerProgramme();
  }

  function effacer() {
    if (etat.phase !== "edition") return;
    etat.programme = [];
    remettreAuDepart();
    dessinerProgramme();
  }

  // ---------- Exécution pas à pas ----------
  function lancer() {
    if (etat.phase !== "edition") return;            // un 2e clic sur « Go » pendant l'exécution ne fait rien
    remettreAuDepart();
    if (!etat.programme.length) { montrerBulle("oups", "programme_vide"); annoncer(t("programme_vide")); return; }
    etat.phase = "execution";
    majBoutons();
    dessinerProgramme();
    executer(0);
  }

  function executer(i) {
    if (i >= etat.programme.length) { plus(echec, 300); return; }
    for (var k = 0; k < i; k++) if (etat.statuts[k] !== "choc") etat.statuts[k] = "fait";
    etat.statuts[i] = "actif";
    dessinerProgramme();

    var ordre = etat.programme[i], crabe = el("crabe");
    crabe.className = "crabe";
    cacherImpact();
    if (ordre === "G" || ordre === "D") {
      etat.orientation = tourner(etat.orientation, ordre === "G" ? -1 : 1);
      dessinerCrabe(false);
      plus(function () { executer(i + 1); }, DELAI_ORDRE);
      return;
    }
    var pas = DEPLACEMENTS[etat.orientation], l = etat.position.l + pas[0], c = etat.position.c + pas[1];
    if (estMur(l, c)) {
      // Mur ou bord : le crabe se secoue sur place, « Oups ! », puis on passe à l'ordre suivant.
      etat.statuts[i] = "choc";
      dessinerProgramme();
      void crabe.offsetWidth;
      crabe.className = "crabe choc";
      montrerImpact(etat.orientation);
      montrerBulle("oups", null);
      annoncer(t("oups"));
      plus(function () { cacherBulle(); cacherImpact(); crabe.className = "crabe"; executer(i + 1); }, DUREE_OUPS);
      return;
    }
    etat.traces.push({ l: etat.position.l, c: etat.position.c, direction: etat.orientation });
    etat.position = { l: l, c: c };
    dessinerTraces();
    dessinerCrabe(false);
    if (l === etat.arrivee.l && c === etat.arrivee.c) {
      // Coquillage atteint : réussite immédiate, les ordres restants sont ignorés.
      etat.statuts[i] = "fait";
      plus(reussite, 450);
      return;
    }
    plus(function () { executer(i + 1); }, DELAI_ORDRE);
  }

  function reussite() {
    etat.phase = "reussi";
    for (var k = 0; k < etat.statuts.length; k++) if (etat.statuts[k] === "actif") etat.statuts[k] = "fait";
    memoriserReussite(etat.niveau.id);
    dessinerCrabe(true);
    el("crabe").className = "crabe content";
    majBoutons();
    afficherTextes();
    annoncer(t("bravo"));
    el("suivant").focus();
  }

  function echec() {
    // Fin du programme sans coquillage : retour au départ, le programme reste à corriger.
    etat.phase = "edition";
    remettreAuDepart();
    majBoutons();
    dessinerProgramme();
    montrerBulle("oups", "essaie_encore");
    annoncer(t("oups") + " " + t("essaie_encore"));
  }

  function suivant() {
    if (etat.phase !== "reussi") return;
    if (etat.index < NIVEAUX.length - 1) { chargerNiveau(etat.index + 1); return; }
    etat.phase = "fin";
    majBoutons();
    afficherTextes();
    annoncer(t("bravo") + " " + t("fin"));
    el("fin-menu").focus();
  }

  function retourMenu() {
    window.location.href = "../index.html?lang=" + langue;
  }

  function changerLangue(code) {
    if (!TEXTES[code]) return;
    langue = code;
    ecrire(CLE_LANGUE, code);
    afficherTextes();          // ne touche pas à l'exécution en cours
  }

  // ---------- Mise à l'échelle (même technique que le lanceur) ----------
  function mettreAEchelle() {
    var largeur = document.documentElement.clientWidth, hauteur = document.documentElement.clientHeight;
    var echelle = Math.min(largeur / 1024, hauteur / 768);
    var transformation = "translate(" + (largeur - 1024 * echelle) / 2 + "px," + (hauteur - 768 * echelle) / 2 + "px) scale(" + echelle + ")";
    el("scene").style.webkitTransform = transformation;
    el("scene").style.transform = transformation;
  }

  // ---------- Événements ----------
  function surClic(id, fonction) { el(id).addEventListener("click", fonction); }
  surClic("fleche-A", function () { ajouterOrdre("A"); });
  surClic("fleche-G", function () { ajouterOrdre("G"); });
  surClic("fleche-D", function () { ajouterOrdre("D"); });
  surClic("go", lancer);
  surClic("effacer", effacer);
  surClic("suivant", suivant);
  surClic("menu", retourMenu);
  surClic("fin-menu", retourMenu);
  el("programme").addEventListener("click", function (evenement) {
    var cible = evenement.target;
    while (cible && cible !== this && !cible.getAttribute("data-index")) cible = cible.parentNode;
    if (cible && cible !== this) retirerOrdre(Number(cible.getAttribute("data-index")));
  });
  el("langues").addEventListener("click", function (evenement) {
    var code = evenement.target.getAttribute && evenement.target.getAttribute("data-langue");
    if (code) changerLangue(code);
  });

  // Clavier : flèches = ordres, Entrée = Go (hors bouton focalisé), Retour arrière = retirer le dernier ordre.
  document.addEventListener("keydown", function (evenement) {
    var touche = evenement.key || "", code = evenement.keyCode;
    var surBouton = document.activeElement && document.activeElement.tagName === "BUTTON";
    if (touche === "ArrowUp" || touche === "Up" || code === 38) { evenement.preventDefault(); ajouterOrdre("A"); }
    else if (touche === "ArrowLeft" || touche === "Left" || code === 37) { evenement.preventDefault(); ajouterOrdre("G"); }
    else if (touche === "ArrowRight" || touche === "Right" || code === 39) { evenement.preventDefault(); ajouterOrdre("D"); }
    else if (touche === "Backspace" || code === 8) { evenement.preventDefault(); retirerOrdre(etat.programme.length - 1); }
    else if ((touche === "Enter" || code === 13) && !surBouton) { evenement.preventDefault(); if (etat.phase === "reussi") suivant(); else lancer(); }
  });

  window.addEventListener("resize", mettreAEchelle);

  // ---------- Démarrage : premier niveau non réussi ----------
  ecrire(CLE_LANGUE, langue);
  construireLangues();
  mettreAEchelle();
  var depart = 0;
  while (depart < NIVEAUX.length - 1 && niveauReussi(NIVEAUX[depart].id)) depart++;
  if (progression.serie_terminee) depart = 0;
  chargerNiveau(depart);

  // Accès pour les tests automatisés (sans effet pour l'enfant).
  window.labyrinthe = { etat: etat, chargerNiveau: chargerNiveau, ajouterOrdre: ajouterOrdre, lancer: lancer };
})();
  </script>
</body>
</html>
